<style>
  .ocf-colophon-container {
    background-color: #f9f9f9; /* 淺灰背景，區隔內容 */
    border-top: 2px solid #eee;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #555;
    font-size: 0.95rem;
    line-height: 1.6;
    border-radius: 8px;
    margin-top: 20px;
  }

  /* 連結通用樣式 */
  .ocf-colophon-container a {
    color: #007bff;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
  }
  .ocf-colophon-container a:hover {
    color: #0056b3;
    text-decoration: underline;
  }

  /* 第一區：核心授權聲明 */
  .ocf-license-main {
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 1px solid #e0e0e0;
  }
  .ocf-license-main i.icon {
    margin-right: 5px;
  }

  /* 第二區：資源連結網格 (Grid System) */
  .ocf-resource-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* 自動適應寬度 */
    gap: 15px;
    margin-bottom: 25px;
  }

  /* 資源連結卡片 */
  .ocf-resource-item {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 15px;
    font-size: 0.9em;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .ocf-resource-item:hover {
    border-color: #007bff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    text-decoration: none; /* 卡片 hover 時不畫底線，僅連結變色 */
  }
  .ocf-resource-item span {
    display: block;
    margin-bottom: 5px;
    color: #888;
    font-size: 0.85em;
  }
  .ocf-resource-item .link-text {
    color: #333;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ocf-resource-item:hover .link-text {
    color: #007bff;
  }

  /* 第三區：底部法律條款 */
  .ocf-legal-footer {
    font-size: 0.85em;
    color: #888;
    text-align: center; /* 置中顯示 */
    background: #f0f0f0;
    padding: 10px;
    border-radius: 4px;
  }
  .ocf-legal-footer span {
    margin: 0 10px;
  }
  
  /* RWD 調整 */
  @media (max-width: 600px) {
    .ocf-resource-grid {
      grid-template-columns: 1fr; /* 手機版單欄 */
    }
    .ocf-legal-footer span {
      display: block;
      margin: 5px 0;
    }
  }
</style>
