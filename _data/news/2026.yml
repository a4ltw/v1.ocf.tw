  description: 我們撰寫《AI-Ready 開放資料實踐研究：賦能資料管理者，促進公民與政府對話》報告，不是要大家「做更多」，而是要「做更準」，從研究各國開放資料出發到成為訓練資料的實務案例，希望在現有的流程中微調觀念與資料格式，將政府開放資料在準備時就已經快速導向成 AI 訓練可用的資料，加速驅動主權 AI 發展 。
