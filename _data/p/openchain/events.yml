- id: open-source-business-ai-competitiveness-2026
  name: "開源不只是技術選擇：AI 時代企業布局國際競爭力的起點"
  name_en:
  description: >-
    AI 正在改變軟體產品的開發、營運與國際競爭規則，而開源也不再只是工程團隊的技術選擇。從開源授權、SBOM、AI 治理，到社群經營、開放資料與營運工具導入，企業需要重新理解開源如何成為建立信任、降低風險與連結市場的關鍵能力。本次聚會將從合規趨勢、商業策略與新創實戰出發，陪伴企業在 AI 時代找到重塑國際競爭力的起點。
  start: 2026/06/22
  end:
