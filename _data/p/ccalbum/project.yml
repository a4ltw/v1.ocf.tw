name: 公眾授權專輯
name_en: CC Album

description: 開源理念從軟體世界蔓延到各個領域，Creative Commons 授權條款的出現，讓創作者能夠更彈性地選擇如何分享自己的作品。OCF 與音樂家、攝影師、插畫家等各領域創作者合作，嘗試用公眾的作品，將開源理念更廣泛地傳遞，讓更多人能夠自由地使用和分享，促進知識與文化的流通與交流。
description_en: The philosophy of open source has spread from the software world to various other fields. The emergence of Creative Commons licenses grants creators greater flexibility in deciding how to share their work.OCF collaborates with creators across diverse disciplines—including musicians, photographers, and illustrators—to propagate open source ideals through accessible works. This initiative enables more people to freely use and share resources, fostering the circulation and exchange of knowledge and culture.

