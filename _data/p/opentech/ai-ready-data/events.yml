  name_en: "g0v Summit Forum: Open Data in the Age of AI - Taiwan's Next Step in Co-Creation from International Public-Private Collaboration"
  description: 這場論壇聚焦 AI 時代下開放資料的下一階段挑戰，從國際公私協作經驗出發，討論台灣如何推動更可用、可治理、可協作的 AI-Ready 開放資料。
  description_en: This forum focused on the next-stage challenges of open data in the age of AI, drawing from international public-private collaboration experiences to discuss how Taiwan can promote more usable, governable, and collaborative AI-ready open data.
