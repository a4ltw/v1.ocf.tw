    columns:
      - type: article
        alignment: left
        title: 女孩的觀察小筆記
        description: |
          <div class="ocf2025-note"><p>從前我以為「開源」只是大家聚在一起寫免費程式，但讀到 OCF 寫的《開放原始碼良善治理手冊》和推動的「公共程式」才發現，開源的核心其實是一場關於「權利」的運動。</p><p>如果政府用的程式碼不透明，我們就無法監督；如果人權團體沒有安全的開源工具和資安基礎指引，民眾就難以發聲。OCF 就像是數位世界裡的造橋者，確保我們腳下所踩的每一塊磚石都是透明且安全的。</p></div>

  - type: content
    columns:
      - type: article
        alignment: left
        title: 我想知道，我們到底吃了什麼？
        description: |
          <div class="ocf2025-story">
          <p class="ocf2025-story-lead">我開發的訂餐 App 正式上線了！同學間好評不斷，學校甚至送了我小功一支。</p>
          <p>隨著越來越多人購買合作社的餐食，我開始好奇：為什麼有些菜色總是缺貨？食材來源又真的安全嗎？我試著向學校索取過去三年的飲食採購資料，想做成視覺化圖表讓大家監督。結果學務處主任卻推託說「那是內部資料，不方便公開」，最後只給了我一份難以用程式分析的 PDF 檔。</p>
          <p>這是我第一次感受到「資料不透明」的無力、落實「開放資料」的重要。如果連學校福利社的資料都這麼難拿，或是拿到了程式難以讀取的資料格式，那政府手裡掌握的預算、環境監測資料、甚至法案推動的流程，普羅大眾又真的能看到全貌嗎？</p>
          <p>我這才理解 OCF 為什麼在「開放原始碼」之外，還要推動開放資料與開放政府。與民生相關的非敏感資料，不應該是被關在公部門硬碟裡的秘密，每個公民都該有自由取用、監督的權利。如果沒有透明的資料，我們所謂的「公眾參與」，都只是在迷霧中盲目摸索。</p>
          <p>因此我決定堅持到底，仿照 OCF 的倡議方式與溝通策略，去敲開那扇通往真相的大門！</p>
          </div>
