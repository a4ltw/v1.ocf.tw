    icon: code branch
    title: 01 開放科技
    description:
  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: 開放原始碼，就是數位世界的公共設施
        description: |
          <p>在數位世界裡，我們每天使用的軟體與服務就像是建築的地基。OCF 過去一年在「開放科技」的投入，就是為了確保這座地基不被壟斷、安全可靠且具備公共性。</p>
          <div class="ocf2025-detail-grid">
            <section>
              <h3>軟體供應鏈的守護者：推動 OSPO 治理與國際接軌</h3>
              <p>開源軟體是政府與企業運作的核心，但如何「用得對、管理得當」就是門學問。OCF 在今年也致力將複雜的治理觀念，轉化為可執行的工具。</p>
              <ul>
                <li><strong><a href="https://ocf.tw/story/ospos-1-join-OSPO-alliance/">國際聯盟首位臺灣成員，正式加入 OSPO Alliance</a>：</strong>OCF 是臺灣第一個加入 OSPO Alliance 的組織，將全球正熱門的開源治理經驗引進國內。</li>
                <li><strong>釋出治理手冊、共享數位資產：</strong><a href="https://dub.sh/OSPO-GGI-ZHTW">翻譯並釋出《開放原始碼良善治理手冊》正體中文版</a>，並協力將自由軟體鑄造場（OSSF）及台灣創用 CC 計畫（CCTW）過往研究網站保存的數位資產<a href="https://github.com/ocftw">重新備份到 OCF GitHub</a>。</li>
                <li><strong><a href="https://ocf.neticrm.tw/civicrm/mailing/view?reset=1&id=382">出訪 FOSDEM，觀察數位韌性法案</a>：</strong>第三次出席歐洲最大開源研討會 FOSDEM，把臺灣經驗帶到國際社群，也追蹤「數位韌性法案（CRA）」對開源合規的影響。</li>
              </ul>
            </section>
            <section>
              <h3>數位主權的守門員：<a href="https://ocf.tw/p/pmpc/">公共程式（PMPC）</a>與在地實作</h3>
              <p>OCF 長期倡議開放原始碼，也致力讓開源在政府機關落實，讓關乎公眾利益的程式碼能真正由國家和公民所擁有和控制。</p>
              <ul>
                <li><strong>協助臺北市政府完成「發展導入開源評估指引」：</strong>針對伺服器虛擬化與資料庫軟體，實際進行兩案開源替代方案評估測試，加速機關採納開源軟體。</li>
                <li><strong>國際標準在地化：</strong>完成 Standard for Public Code 最新版（0.8.1）的繁中翻譯，確保臺灣推動公共程式時能與國際技術規格接軌。</li>
                <li><strong>協力數位發展部，搭建政策對話橋樑：</strong>協力辦理 4 場數位部「公共程式發展承諾事項」小組會議，讓民間社群、科技廠商與政府官員共商軟體公共化的下一步。</li>
              </ul>
            </section>
          </div>

