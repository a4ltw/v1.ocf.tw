  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: 女孩的觀察小筆記
        description: |
          <div class="ocf2025-note"><p>資安不只是「不亂點不明連結」、數位人權也不僅是「警察是否執法過當」。透過 OCF 的這些國際年會參與，我才發現數位人權涵蓋了現代生活的方方面面。</p><p>而許多的議題，也不只發生在臺灣，OCF 遠赴馬來西亞、韓國、葡萄牙參與會議，不只把臺灣的案例分享出去，也把國外的數位防禦經驗帶回來。他們讓我覺得，雖然數位威權看起來很巨大，但只要有人在守護這條防線，我們就絕不會孤立無援。</p></div>

  - type: content
    columns:
      - type: article
        alignment: left
        title: 數位世界的血管
        description: |
          <div class="ocf2025-story">
          <p class="ocf2025-story-lead">某個平凡的午後，當全校在票選下週菜單時，網路突然 lag 到不行。</p>
          <p>不只我們學校，整個區域的網路都變得異常卡頓。起初，我以為只是電信商的短暫當機。但翻查新聞後才震驚地發現，導致這場大規模斷網的元凶，也有可能是深海中的海底電纜發生了斷線。前幾年馬祖也發生過海底電纜斷線事件，引發了當地居民的諸多不便，倘若全臺電纜劣化或受到破壞，影響更不堪設想！</p>
          <p>這場突如其來的斷網，才使我驚覺網路對我這世代生活的重要性，而通暢的網路也並非理所當然。我想起 OCF 也在推動的「網路自由」，雖說民主臺灣目前相對沒有「網路審查」或像國外一樣被政府蓄意斷網的疑雲，但因為是海島國家，基礎設施的韌性卻依舊脆弱。如果海纜、基地台遭人侵擾，甚至因地緣政治被切斷，每天都需要上網的我們，數位生活便會被迫停擺。</p>
          <p>網路自由不光是上網的自由，也包括自由發表言論、不被審查的自由。我這才理解 OCF 積極關注的網路自由與基礎建設。他們要守護的，不只是螢幕上的言論自由，也是那些深埋在海底、維持民主社會運作的血管。沒有了暢通且自由的網路，我們建構的所有理想，都只是一道海浪就能推倒的沙堡。</p>
          </div>
      - type: article
        alignment: center
        title:
        description: |
          <figure class="ocf2025-illustration"><img src="/p/2025/images/girl-internet-freedom.png" alt="小女孩看見網路斷線與網路自由議題"></figure>

  - type: header
    anchor: internet-freedom
    theme: light
    color:
    icon: wifi
    title: 04 網路自由
    description:
  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: <a href="https://ocf.tw/p/infr/">網路自由</a>
        description: |
          <p>當威權主義透過各種數位工具全境蔓延，網路自由的定義，更包含了「網路韌性」與「不被監控的言論自由」。OCF 致力於提升臺灣的數位韌性，並引進開源的防審查技術與趨勢。</p>
          <div class="ocf2025-detail-grid">
            <section>
              <h3>數位韌性的極端實測</h3>
              <p>網路自由並非虛無飄渺，在看不見的地底，有海底電纜維繫著數位世界的血管，而其脆弱直至近期才為人所知。OCF 今年持續透過每月一次的網路自由小聚社群討論與技術研究，提前為緊急情況做準備。</p>
              <ul>
                <li><strong>防禦大規模斷網：</strong>在網路自由小聚中，與專家共同探討大規模斷網下的替代通訊方案，包括如何利用 Hermes Project 韌性通訊技術、Winlink 無線電通訊，確保海纜受損時民間仍有基本救援與資訊流通能力。</li>
                <li><strong>借鏡國際經驗：</strong>專題討論「國家安全與數位權利」，借鏡烏克蘭在衝突威脅下維持通訊不斷線的實戰經驗，討論臺灣的執行策略。</li>
              </ul>
            </section>
            <section>
              <h3>反對數位審查，守護言論自由</h3>
              <p>針對一連串修法對使用者生成內容（UGC）的衝擊，OCF 透過網路自由小聚，廣邀專家學者、民間團體與政府機關<a href="https://ocf.tw/story/epaper/2025/202511news/wiki-sue/">共同討論解方</a>，同時也呼籲社會：法規完善需要多方討論，落實也需要完整配套。若一味開罰，可能造成寒蟬效應、平台擴大事前審查，進而侵害民眾的網路言論自由。</p>
            </section>
          </div>

  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title:
        description: |
          <div class="ocf2025-photo-grid">
            <figure><img src="/p/2025/images/digital-governance.jpg" alt="2025 年參與臺灣網路治理論壇 TWIGF 並分享數位平台治理議題"><figcaption>2025 年參與臺灣網路治理論壇 TWIGF 並分享數位平台治理議題</figcaption></figure>
            <figure><img src="/p/2025/images/cloud-privacy.png" alt="OCF 舉辦雲端資料與隱私的討論活動"><figcaption>OCF 舉辦雲端資料與隱私的討論活動</figcaption></figure>
            <figure><img src="/p/2025/images/cloud-ghost.jpg" alt="雲端亡魂書店講座"><figcaption>《雲端亡魂》書店講座</figcaption></figure>
          </div>

  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: 女孩的觀察小筆記
        description: |
          <div class="ocf2025-note"><p>網路斷了，不只是影響追劇、滑不了手機而已，可能基本民生需求都會出問題。看到 OCF 在討論斷網時的替代機制，我才驚覺，原來網路是這麼脆弱的存在。</p><p>過去一年，我看到 OCF 的夥伴們前往世界各地，與專家交換臺灣在網路自由、數位人權上的努力經驗與實踐。雖然在網路連線如氧氣常在的臺灣，網路自由還不是民眾熟悉的議題，但我相信持續倡議、舉辦討論，會有更多人關注潛在的危機、並及早動身尋求解方。</p></div>

  - type: content
    columns:
      - type: article
        alignment: left
        title: 一個人走得快，一群人走得遠
        description: |
          <div class="ocf2025-story">
          <p class="ocf2025-story-lead">一個學期轉瞬就過去，我的訂餐系統不僅在學校廣受歡迎，還引起了其他學校的興趣。</p>
          <p>OCF 邀請我帶著這個專案，去參加一場國際開源年會。在那裡，我遇到來自不同國家的青少年開發者，有人在非洲用開源硬體解決供水問題，有人在歐洲推動數位投票系統。在這樣的盛會，看著這些志同道合的人，我發現，我不再是那個坐在螢幕前，面對龐大體制感到無力的小女孩了。當我們把這些經驗與程式碼匯聚起來，社群的能量，足以鼓舞我們一起前往更遠的地方。</p>
          <p>在這些交流會上，我們分享各自面對的數位挑戰，也感受到開源社群源源不絕的動能。我想，這就是 OCF 致力於「社群經營」的用意。他們不只是在推廣技術，也織出一張巨大的支持網。</p>
          <p>透過參訪及國際交流，他們讓臺灣開源的能量與世界接軌。現在的我終於明白，那把通往美好的數位未來的鑰匙，傳遞在願意共享知識、樂於協作的社群之間。一個人或許可以衝得很快，但一群志同道合的朋友，可以走得更遠。</p>
          </div>
      - type: article
        alignment: center
        title:
        description: |
          <figure class="ocf2025-illustration"><img src="/p/2025/images/girl-community.png" alt="小女孩觀察開放社群的協作現場"></figure>

  - type: header
    anchor: community
    theme: light
    color:
    icon: users
    title: 05 開放社群經營
    description:
  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: 技術會更迭，但社群的精神會傳承
        description: |
          <p>OCF 自 2014 年創立以來就以服務臺灣開源社群為宗旨，協助行政、財務工作，讓社群致力於社群發展，同時也透過人才培育、教育創新與跨界實驗，擴大臺灣開源社群的影響力。</p>
          <div class="ocf2025-detail-grid">
            <section>
              <h3>為開源人才推行 <a href="https://ocf.tw/p/oscvpass/">OSCVPass</a> 專案</h3>
              <p>延續長期對開源貢獻者的剖析與理解，OCF 受邀協力數位產業署及資訊工業策進會，以 AI 技術小聚中的「開源業師輔導機制」營運試點，檢視 AI 相關技術社群在開源貢獻質量化成果，尋求有助於產業的開源人才滾動機制。</p>
              <p>此外，OCF 建立快速通關回饋機制 OSCVPass，為長期投入開源專案的夥伴提供 SITCON、COSCUP 等大型研討會的快速通關或票券優惠。這不只是一張票，更是對協作精神的實質敬意。</p>
            </section>
            <section>
              <h3><a href="https://ocf.tw/p/openstarter/">《開源星手村》</a>桌遊走進更普及的教育現場</h3>
              <p>OCF 自主開發開源教育桌遊《開源星手村》，將複雜的開源專案概念與協作流程轉化為遊戲體驗，並搭配使用條款查詢學習單、AI 的開放資料運用等實作活動。在不斷改版精進課程下，桌遊及教案入選《親子天下》2025 教育創新 100。</p>
              <p>OCF 今年透過 4 場深度互動工作坊，將開放科技觀念導入台師大、高師大及五專校園；日本社群 Code for Japan 也正式 Fork 出日文版並發起募資，讓臺灣的開源教育經驗正向國際輸出。</p>
            </section>
            <section>
              <h3>跨界文化的共享實驗：從<a href="https://ocf.tw/story/epaper/2025/202509news/jja-music/">《時間浸漬》到《明日音》</a></h3>
              <p>OCF 透過公眾授權音樂，提倡開放文化不限於資訊科技，也能讓音樂、圖像等不同領域的創作花開滿地。2024 年 OCF 與林強、Luca Bonaccorsi 合作，以 CC BY-SA 4.0 發行《時間浸漬》專輯；2025 年啟動第二張 CC 授權專輯《明日音》募資，與 Mong Tong 及 XTRUX 合作。</p>
              <p>專輯中的<a href="https://ocf.tw/p/ccalbum/">音源與素材皆採公眾授權完整開放</a>，只要標示原作者，任何人都能自由 Remix、取樣甚至商業使用，象徵創作者將音樂主權交還給公眾。</p>
            </section>
            <section>
              <h3>二十載的傳承：COSCUP 20 週年開源政策軌</h3>
              <p>作為臺灣最具代表性的開源社群盛會，OCF 在 COSCUP 策劃開源政策專屬議程，分享快捷式醫療服務互操作資源（Fast Healthcare Interoperability Resources）與城市通 App 等 9 場議題，探討開源相關政府政策如何對公民產生實質影響。</p>
            </section>
          </div>

