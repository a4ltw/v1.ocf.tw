        alignment: left
        title: 女孩的觀察小筆記
        description: |
          <div class="ocf2025-note"><p>從前，我以為資料開放就是把檔案丟到網站上，後來才發現，開放資料是有要求和品質分數的。如果格式不方便機器讀取，又或法律沒有明確規範政府機關必須開放時，民眾便難以取得。</p><p>看到 OCF 跑去立法院、跑去行政院，甚至來到大學校園講課，我才明白「開放」是一場需要跟時間賽跑的耐力賽。特別是 OCF 跟愛陌生協會合作提升 AED 地圖開放資料準確性的案例，讓我覺得很酷——原來當資料變得透明且正確，它就不只是硬碟裡生硬的資料，而是能保護每個人的堅強助力。</p></div>

  - type: content
    columns:
      - type: article
        alignment: left
        title: 演算法背後，是誰在看著我？
        description: |
          <div class="ocf2025-story">
          <p class="ocf2025-story-lead">這幾個月來，在不斷的溝通與衝撞下，校方的食材資料齊全了，App 的版本也在開發者前輩的建議下越來越成熟。</p>
          <p>但就在這個訂餐系統越來越受歡迎時，發生了一件令人毛骨悚然的事：我發現某間長期與校方合作的餐飲企業，竟然私下來信，希望我把在校生的點餐偏好、過敏記錄甚至作息時間，「授權」給他們當作行銷資料。</p>
          <p>想當然耳，我拒絕了，但這事件也讓我驚覺，在這個萬物聯網的時代，我們每一個不經意的數位足跡、每一筆被轉換成 0 與 1 的日常行為，原來都可能淪為企業間私下交易的「貨幣」。在糖衣包裹的科技便利之下，我們的隱私變得更加岌岌可危。</p>
          <p>這就是 OCF 守護的「數位人權」防線。在無孔不入的網路商業監控，與 AI 技術可能遭逢濫用的陰影下，我們迫切需要更嚴謹、更能保護個資與數位人權的法規。我不希望未來的數位生活，是以我們的個資作為交易貨幣。</p>
          <p>那一天晚上，我徹夜檢查原始碼，親手刪掉了所有不必要的追蹤碼，因為我明白，守護同學的個人資料，就是在守護他們身而為人的基本尊嚴。</p>
          </div>
