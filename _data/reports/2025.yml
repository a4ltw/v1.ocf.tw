  - type: content
    columns:
      - type: image
        url: /p/2025/cover.png
        swap: false
      - type: article
        alignment: left
        title: 嘿，很高興在這裡見到你
        subtitle: 談談我們所處的這個世界
        description: |
          <p>在我成長的臺灣社會，大多事都能轉化為 0 與 1 的組合：我們在社群軟體上聊天、購物、從網路搜尋知識，大大小小的生活瑣事如今都在線上完成。在長大的過程中，我發現真實世界裡，我們有歷史悠久的法律、社會制度，無形中在維持、調整著世界的秩序。然而，相較之下，我卻發現人們棲身的數位世界，其實和我一樣年輕、還有些混沌不明。</p>
          <p>我不希望未來的數位世界是個巨大的黑盒子，藏滿了看不見的監控與操縱。我期待的未來，應該是透明、能夠被討論，且是每個人都能參與編寫的。</p>
          <p>這座打通數位世界的橋樑，尚在建造中，也需要更多人的關注，所以不妨透過我的視角，看看這一年來，「開放文化基金會」正如何為了我們這代人的數位自由而戰。</p>

  - type: content
    columns:
      - type: article
        alignment: left
        title: 與世界中的開發者們跑接力賽
        description: |
          <div class="ocf2025-story">
          <p class="ocf2025-story-lead">我會認識 OCF 以及他們正在做的事情，起初只是因為我想在合作社吃到一碗熱騰騰的滷肉飯。</p>
          <p>二十一世紀都要過四分之一了，我們學校合作社至今還沒有線上訂餐系統！每到中午，大家只能排隊空等，買到飯時，午休早就過了一半。面對這日復一日的窘境，我突發奇想，既然都上了那麼多年的學校資訊課，為什麼我不自己寫一個大家都能用的線上訂餐 App？</p>
          <p>才開工不久，我發現自己很快就卡關了。那些複雜的後端金流和驗證機制，對一個十六歲高中生來說簡直是越級打怪。直到我點開 GitHub，推開了「開放原始碼」世界的大門。在那裡，我找到了一個學長分享的訂餐系統模板。最讚的是，這份模板沒有所謂「版權所有、翻印必究」這回事，而是「歡迎轉用與協作」！</p>
          <p>於是我馬上踩在巨人的肩膀上，運用這套程式碼修改出我們學校的版本；甚至，把我的版本傳回 GitHub，幫助了另一個社團的學弟。那一刻我深刻體會到：當技術不再被鎖在黑盒子裡，我們就不必一次次從零開始蓋房子。這，就是 OCF 一直在說的「協作」吧？彷彿是與網路上的開發者們跑接力賽，我的貢獻也能成為他人的墊腳石。原來，開放原始碼就是數位世界裡不可或缺的「公共設施」。</p>
          <p>回過頭看，既然高中生都能靠著開源精神解決校園的午餐危機，那麼在更大的社會舞台上呢？OCF 在這年針對「開放科技」——包括開放原始碼、開放資料、開放政府——為我們搭建了哪些數位橋樑？</p>
          </div>
