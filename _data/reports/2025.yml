  - type: header
    anchor: open-government
    theme: light
    color:
    icon: database
    title: 02 開放政府與資料
    description:
  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: 資料不應該是被關在公部門硬碟裡的秘密
        description: |
          <p>OCF 過去一年扮演了「倡議者」與「教育者」的雙重角色，不僅在體制內推動法制化，更讓開放文化的種子走入國會與校園。</p>
          <div class="ocf2025-detail-grid">
            <section>
              <h3>翻轉權力核心：打造「智慧與開放」的政府與國會</h3>
              <p>AI 浪潮襲來，掌握國家法律的國會準備好了嗎？OCF 在過去一年持續推動國會及政府的運作透明化與數位化，讓開放政府成為可能。</p>
              <ul>
                <li><strong>國會應用 AI 指引：</strong>協力英國 WFD 西敏寺民主基金會於立法院辦理「當國會遇見 AI：國會應用 AI 指引發布分享會」，探討如何負責任地使用 AI，讓科技安全地成為輔助決策工具。</li>
                <li><strong>凝聚開放共識：</strong>於 g0v 社群空間與 WFD 合作辦理「開放國會的下一步」閉門座談會，重新串連社群，確保開放國會承諾持續傳承與對話。</li>
                <li><strong>化行動成對話：</strong>出任行政院開放政府國家行動方案推動小組委員，持續在各部會間扮演溝通橋樑。</li>
                <li><strong>開放政府的深根落地：</strong>協助法務部辦理薦任第九職等政風主管研究班，讓開放政府觀念持續深入公務人員實際運作。</li>
              </ul>
            </section>
            <section>
              <h3>打造開放基石：從法案、協作到全球串連</h3>
              <p>推動開放資料，需要強而有力的法律基石。OCF 深度參與政策諮詢，確保法條不只服務技術，更應守護人權。</p>
              <ul>
                <li><strong>推動部會間協作：</strong>在退輔會、陸委會、文化部擔任部會等級資料開放諮詢委員，協助各部會在 AI 時代持續依循可行的開放資料路線前進。</li>
                <li><strong>法案倡議與影響評估：</strong>出席<a href="https://ocf.neticrm.tw/civicrm/mailing/view?reset=1&id=352">《促進資料創新利用發展條例》草案</a>多場民間諮詢、利害關係人會議，並針對人權影響評估提供專業意見。</li>
                <li><strong>國際組織的開放推動：</strong>作為 Open Knowledge Foundation 開放資料管理工具 Open Data Editor 的使用者研究諮詢合作夥伴，分享在地倡議經驗。</li>
              </ul>
            </section>
            <section>
              <h3>開放課程走入校園，培育未來的數位公民</h3>
              <p>開放文化不應止步於技術社群，更要成為跨領域的通識基礎知能，也融入公部門及非營利組織的知識增能。</p>
              <ul>
                <li><strong>開源擴散進校園：</strong>透過多元主題與場域組合，執行 6 場系列講座，走進東吳、臺北大學、陽明交通大學等校系，議題橫跨開放資料、AI 數位創作、數位人權與社會責任。</li>
                <li><strong>數位公民基礎知能：</strong>在臺灣歷史博物館分享國際「數位公共財」趨勢，並協力「香港邊城青年」學習如何負責任地使用 AI 進行公共表達。</li>
              </ul>
            </section>
            <section>
              <h3>修復資料品質：公民科技的實戰</h3>
              <p>開放資料不能只求其「有」，更要「好用」。OCF 與愛陌生協會合作，透過公民科技的力量<a href="https://ocf.tw/story/epaper/2025/202511news/aed/">改善 AED（自動體外心臟電擊去顫器）的資料品質</a>，期望高品質的開放資料在關鍵時刻真的能救命。</p>
            </section>
          </div>

