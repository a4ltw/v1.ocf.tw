        title: 致數位時代的公民
        description: |
          <div class="ocf2025-letter">
          <p>數位科技的發展，正在深刻影響我們每個人如何生活、如何思考，以及如何行使權利。</p>
          <p>邀請你跟著我們透過一位十六歲女孩的視角，體驗與思考這個時代最真實的集體課題。過去我們努力爭取的開放、自由、透明與參與，隨著科技的快速發展，正逐漸被不透明的程式碼與演算法所隱蔽。我們看似在數位世界裡自由穿梭，但是每個人的隱私、偏好甚至未來的可能性，卻正被少數人編寫的技術規則所定義。</p>
          <p>開放文化基金會（OCF）存在的理由，正是為了確保科技的運作規則，能重新掌握在每一位數位公民的手中。</p>
          <p>過去這年，我們不僅「談論」自由，更在第一線「實踐」開放。我們推動公共程式（Public Code）理念，要求政府主動採用開源軟體，避免公共資源被特定廠商壟斷（Vendor Lock-in）；透過開放科技車庫與資安陪伴計畫，我們為公民社會築起資安防線；同時，我們也深入討論數位人權法案，確保隱私與自由不成為科技進步的代價。</p>
          <p>面對 AI 浪潮帶來訓練資料的討論、安全與隱私危機，OCF 也前進立法院，協力推動「國會應用 AI 指引」，並參與數位部多場會議，探討政府如何負責任地使用 AI，確保個人資料受到保護、創作者權益獲得保障。我們相信，解決數位困境的最佳路徑是透明共享，AI 應該是造福社會的公共財，而非失序的工具。</p>
          <p>OCF 期待的是一個真正開放且透明的數位未來。在這個世界裡，透過開源程式碼、開放資料與開放政府，每個人都能平等地參與協作，守護屬於自己的權益。誠摯邀請你成為 OCF 的後盾，與我們並肩推動更好的數位生活，將這份決定未來的力量，穩穩掌握在自己手中。</p>
          <p class="ocf2025-signature">開放文化基金會 執行長 <img src="/p/2025/images/signature.png" alt="執行長簽名"></p>
          </div>
