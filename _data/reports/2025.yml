  - type: header
    anchor: digital-rights
    theme: light
    color:
    icon: shield alternate
    title: 03 數位人權
    description:
  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title: 數位世界的自由不是理所當然
        description: |
          <p>過去一年，OCF 透過國際會議出訪與在地社群紮根，努力守護每一位公民的隱私與言論自由。</p>
          <div class="ocf2025-detail-grid">
            <section>
              <h3>國際外交的數位前線：將臺灣經驗帶向世界</h3>
              <p>數位權利的威脅是全球性的。OCF 積極參與多場具權威的國際大會，確保臺灣在亞太、乃至全球的數位治理中不缺席。</p>
              <ul>
                <li><strong>亞太數位權利大會（DRAPAC）：</strong>於吉隆坡介紹 OCF 的 12 個月「資安陪伴計畫」，與推廣數位人權與科技議題的國際夥伴，交流如何支援高風險環境下的倡議工作者。</li>
                <li><strong>全球隱私大會（GPA）：</strong>於首爾論壇分享臺灣公民社群在隱私與數位權利保護上的實質貢獻。</li>
                <li><strong>亞洲民主大會（Asia Democracy Assembly）：</strong>於全亞洲最具影響力的民主盛會，深度解析臺灣遭遇跨境數位攻擊的防禦策略，拆解威權主義行動。</li>
                <li><strong>Global Gathering：</strong>在葡萄牙連結臺灣及全球數位人權國際組織及工作者，與各國與會者交流臺灣及國際數位權利發展的最新趨勢。</li>
              </ul>
            </section>
            <section>
              <h3>RightsCon 2025 臺北年會首度在臺舉辦</h3>
              <p>2025 年，由國際組織 Access Now 主辦的「<a href="https://ocf.tw/p/rightscon2025/">RightsCon 全球數位人權大會</a>」移師臺灣，一連 4 天在臺北國際會議中心舉行。OCF 作為 2025 RightsCon 的在地夥伴，在這場國際的人權盛會中直接與世界各地的開發者、學者交流，串聯臺灣的 NGO 組織，一起發掘更多實際可執行的人權守護策略。</p>
              <ul>
                <li><strong>網路自由、網路審查、匿名網路工作坊：</strong>在 RightsCon 期間，OCF 舉辦網路自由工作坊，邀請 Tor 瀏覽器、隱私作業系統 Tails、全球網路監測組織 OONI 來臺，讓臺灣開發者能直接與國際團隊交流，分享各地如何偵測網路封鎖、規避數位監控，確保資訊流不被惡意阻斷。</li>
                <li><strong><a href="https://ocf.tw/en/p/rightscon2025/joint-statement/">與民間團體攜手提出 9 大訴求</a>：</strong>攜手民間司法改革基金會、台灣人權促進會、國際特赦組織台灣分會等公民團體，發表聯合聲明及 9 項核心訴求，針對 AI 治理與數位人權向政府提出建言，確保臺灣在國際注目下落實開放與透明。</li>
              </ul>
            </section>
            <section>
              <h3><a href="https://ocf.tw/p/defendhrd/">資安陪伴計畫</a>：不讓守護者孤軍奮戰</h3>
              <p>奔波倡議的公民團體（CSOs）與人權工作者（HRDs）往往是跨境威權政府的數位攻擊目標。為了不讓組織在惡意威脅中孤軍奮戰，OCF 自 2024 年起啟動「資安陪伴計畫」，針對 CSOs 與 HRDs 面臨的數位威脅，透過為期一年的實質陪伴，提升組織與個人的資安防禦能力。</p>
              <ul>
                <li><strong>資安攻擊案例分享會：</strong>邀請臺灣資安志願社群 CSCS 之資安分析師，將在資安陪伴計畫期間所發現的針對性釣魚攻擊事件進行技術拆解，讓公民團體從實戰中學習如何防禦數位威權主義的擴張。</li>
                <li><strong>跨領域對話：</strong>在 2025 年 COSCUP 與 HITCON 共同合作規劃的「開源資安軌」中，OCF 現場分享「資安陪伴計畫」的公民團體數位安全現場觀察，媒合開源社群技術力與 CSOs 的需求，共同守護數位安全。</li>
              </ul>
            </section>
            <section>
              <h3>關鍵權利的爭取：法律與治理的攻防</h3>
              <ul>
                <li><strong>健保資料庫「退出權」：</strong>歷經十年的法律爭訟與倡議，成功推動健保資料庫二次利用的「退出權」於 2025 年八月正式上路，守護公民對個人健康數據如何被運用的選擇權利。</li>
                <li><strong><a href="https://ocf.tw/story/epaper/2025/202511news/advrights/">行政院人權行動計畫倡議</a>：</strong>OCF 主張數位人權的保障需要更開放、透明的社會監督，並提出三大訴求，呼籲政府邀請多方利害關係人參與機制，強化跨部會協調，以更透明的方式治理網路。</li>
              </ul>
            </section>
          </div>

  - type: content
    single_column: true
    columns:
      - type: article
        alignment: left
        title:
        description: |
          <div class="ocf2025-photo-grid two">
            <figure><img src="/p/2025/images/rightscon-main.jpg" alt="RightsCon 數位人權大會 2025 OCF 執行長代表致詞"><figcaption>RightsCon 數位人權大會 2025 OCF 執行長代表致詞</figcaption></figure>
            <figure><img src="/p/2025/images/rightscon-statement.jpg" alt="OCF 和臺灣公民團體對 AI 治理與網路自由發表聯合聲明"><figcaption>OCF 和臺灣公民團體對 AI 治理與網路自由發表聯合聲明（照片：RightsCon）</figcaption></figure>
