<style>
  /* --- LINE Pay 專用樣式 (繼承基礎設定並擴充) --- */
  .line-pay-card {
    /* 沿用變數，並新增 LINE 品牌綠 */
    --card-primary: #6450dc;
    --card-primary-dark: #4b3bb3;
    --line-green: #00c300;       /* LINE Pay 品牌綠 */
    --card-bg: #ffffff;
    --card-text: #333333;
    --card-radius: 12px;
    
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--card-bg);
    border-radius: var(--card-radius);
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    border: 1px solid #eaeaea;
    display: flex;
    overflow: hidden;
    max-width: 900px;
    margin: 30px auto; /* 與上下區塊保持距離 */
    line-height: 1.6;
    color: var(--card-text);
    text-align: left;
    position: relative;
  }

  /* 左側圖片區 */
  .lp-img-col {
    flex: 0 0 40%;
    position: relative;
    background-color: #eefdf2; /* 淺綠底色搭配 LINE 風格 */
    min-height: 300px;
    display: flex;
    align-items: center;     /* 垂直置中 */
    justify-content: center; /* 水平置中 */
    padding: 20px;           /* 內距，避免圖片貼邊 */
  }

  /* 為了配合截圖，圖片稍微縮小一點讓它像是一張海報浮在中間，或您可以選擇滿版 */
  .lp-img-col img {
    width: 100%;
    height: auto;
    object-fit: contain; 
    border-radius: 8px; /* 圖片本身加點圓角 */
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* 圖片陰影 */
    transition: transform 0.5s ease;
  }

  .line-pay-card:hover .lp-img-col img {
    transform: scale(1.03);
  }

  /* 左上角浮動標籤 (Badge) */
  .lp-badge {
    position: absolute;
    top: 20px;
    left: 20px;
    background-color: var(--line-green);
    color: #fff;
    padding: 6px 14px;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,195,0,0.3);
    z-index: 10;
  }

  /* 右側內容區 */
  .lp-content-col {
    flex: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* 標題設定 */
  .lp-title {
    font-size: 1.75rem;
    font-weight: 700;
    margin: 0 0 15px 0;
    line-height: 1.3;
    color: #333;
  }
  
  .lp-title span {
    color: var(--line-green); /* LINE Pay 字樣變綠 */
  }

  /* 描述文字 */
  .lp-desc {
    font-size: 1.05rem;
    color: #555;
    margin-bottom: 25px;
  }

  /* 步驟區塊 */
  .lp-steps-box {
    background-color: #f8f9fa;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #eee;
    margin-bottom: 25px;
  }

  .lp-steps-title {
    font-weight: bold;
    color: #333;
    margin-bottom: 12px;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .lp-steps-flow {
    display: flex;
    flex-wrap: wrap; /* 手機版寬度不足時自動換行 */
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    color: #666;
  }

  .lp-step-arrow {
    color: #ccc;
    font-weight: bold;
  }

  .lp-highlight {
    color: var(--line-green);
    font-weight: bold;
  }

  /* 按鈕樣式 (沿用) */
  .lp-btn {
    display: inline-block;
    background-color: var(--card-primary);
    color: #ffffff !important;
    text-decoration: none;
    text-align: center;
    padding: 14px 24px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 1.1rem;
    transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(100, 80, 220, 0.2);
    align-self: flex-start; /* 讓按鈕不要自動滿寬，除非在手機版 */
  }

  .lp-btn:hover {
    background-color: var(--card-primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(100, 80, 220, 0.3);
    color: #ffffff !important;
  }

  /* RWD 手機版 */
  @media (max-width: 768px) {
    .line-pay-card {
      flex-direction: column;
      margin: 20px 0;
      max-width: 100%;
    }
    .lp-img-col {
      flex: none;
      min-height: 240px;
    }
    .lp-content-col {
      padding: 25px;
    }
    .lp-title {
      font-size: 1.5rem;
    }
    .lp-btn {
      align-self: stretch; /* 手機版按鈕滿寬 */
      display: block;
    }
  }
</style>

<div class="line-pay-card">
  
  <div class="lp-img-col">
    <div class="lp-badge">✨ 點數也能捐！</div>
    <img src="/assets/images/LinePay.png" title="LINE Pay 捐款" alt="LINE Pay 捐款">
  </div>

  <div class="lp-content-col">
    <h2 class="lp-title"><span>LINE Pay</span> 輕鬆捐，支持開源</h2>
    
    <div class="lp-desc">
      如果您有綁定信用卡、銀行帳戶，或是手邊有即將過期的 LINE Points 點數，現在都可以直接轉化為對 OCF 的支持！
    </div>

    <div class="lp-steps-box">
      <div class="lp-steps-title">🚀 簡單 3 步驟</div>
      <div class="lp-steps-flow">
        <span>進入捐款頁</span>
        <span class="lp-step-arrow">➔</span>
        <span>選擇「單筆捐款」</span>
        <span class="lp-step-arrow">➔</span>
        <span class="lp-highlight">選擇「行動支付」</span>
      </div>
    </div>

    <a href="https://ocf.tw/supus" target="_blank" class="lp-btn">
      前往捐款頁面 ➔
    </a>

  </div>
</div>
