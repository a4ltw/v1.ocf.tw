<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --ocf-primary: #6450dc;
    --line-green: #06C755; /* LINE Pay 品牌綠 */
    --text-dark: #333;
    --bg-gray: #f8f9fa;
  }

  /* 容器設定 */
  .linepay-container {
    max-width: 900px;
    margin: 40px auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text-dark);
    line-height: 1.6;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    overflow: hidden;
    display: flex;
    border: 1px solid #eaeaea;
  }

  /* 左側圖片區 */
  .lp-image-area {
    flex: 0 0 35%;
    background-color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    border-right: 1px solid #f0f0f0;
    position: relative;
  }

  .lp-image-area img {
    max-width: 100%;
    height: auto;
    object-fit: contain;
  }

  /* LINE Points 提示標籤 */
  .points-badge {
    position: absolute;
    top: 20px;
    left: 20px;
    background: var(--line-green);
    color: white;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: bold;
    box-shadow: 0 2px 5px rgba(6, 199, 85, 0.3);
  }

  /* 右側內容區 */
  .lp-content-area {
    flex: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .lp-title {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 15px;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .lp-title span {
    color: var(--line-green); /* 強調 LINE Pay 字樣 */
  }

  .lp-desc {
    color: #666;
    margin-bottom: 25px;
    font-size: 1rem;
  }

  /* 步驟流程 */
  .step-box {
    background: var(--bg-gray);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 25px;
  }

  .step-label {
    font-size: 0.9rem;
    color: #888;
    margin-bottom: 10px;
    display: block;
    font-weight: bold;
  }

  .step-flow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    color: #444;
    flex-wrap: wrap;
  }

  .step-arrow {
    color: #aaa;
  }

  /* 按鈕樣式 */
  .donate-btn {
    align-self: flex-start;
    background-color: var(--ocf-primary);
    color: #fff;
    text-decoration: none;
    padding: 12px 35px;
    border-radius: 8px;
    font-weight: 500;
    font-size: 1.1rem;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 10px rgba(100, 80, 220, 0.2);
  }

  .donate-btn:hover {
    background-color: #503ebd;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(100, 80, 220, 0.3);
  }

  /* 手機版 RWD */
  @media (max-width: 768px) {
    .linepay-container {
      flex-direction: column;
    }
    .lp-image-area {
      border-right: none;
      border-bottom: 1px solid #f0f0f0;
      padding: 20px;
    }
    .lp-image-area img {
      max-width: 200px; /* 手機版圖片縮小一點 */
    }
    .lp-content-area {
      padding: 30px 20px;
    }
    .donate-btn {
      width: 100%; /* 手機版按鈕滿版 */
      justify-content: center;
    }
    .step-flow {
      font-size: 0.95rem;
    }
  }
</style>
</head>
<body>

<div class="linepay-container">
  
  <div class="lp-image-area">
    <div class="points-badge">✨ 點數也能捐！</div>
    <img src="/assets/images/LinePay.png" title="LINE Pay 捐款" alt="LINE Pay Logo">
  </div>

  <div class="lp-content-area">
    <h2 class="lp-title"><span>LINE Pay</span> 輕鬆捐，支持開源</h2>
    
    <p class="lp-desc">
      如果您有綁定信用卡、銀行帳戶，或是手邊有<strong>即將過期的 LINE Points 點數</strong>，
      現在都可以直接化為對 OCF 的支持！
    </p>

    <div class="step-box">
      <span class="step-label">📌 簡單 3 步驟</span>
      <div class="step-flow">
        <span>進入捐款頁</span>
        <span class="step-arrow">➔</span>
        <span>選擇「單筆捐款」</span>
        <span class="step-arrow">➔</span>
        <span style="color:var(--line-green);">選擇「行動支付」</span>
      </div>
    </div>

    <a href="https://ocf.tw/supus" target="_blank" class="donate-btn">
      前往捐款頁面 ➔
    </a>
  </div>

</div>

</body>
</html>
