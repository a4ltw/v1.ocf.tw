<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  /* 繼承您全站的變數，若沒抓到則使用預設值 */
  :root {
    --ocf-primary: #6450dc; 
    --bg-gray: #f8f9fa;
    --text-color: #333;
    --warning-color: #d9534f;
  }

  /* 捐贈區塊容器 */
  .donate-section {
    max-width: 900px;
    margin: 40px auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text-color);
    line-height: 1.6;
    padding: 20px;
  }

  /* 圖片排版區 (Flexbox) */
  .donate-images {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap; /* 讓手機版自動換行 */
  }

  .donate-images img {
    max-width: 100%; /* 確保圖片不超出螢幕 */
    height: auto;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    border: 1px solid #eee;
  }

  /* 核心標語區 */
  .donate-hero-text {
    text-align: center;
    font-size: 1.2rem;
    margin-bottom: 40px;
    background-color: var(--bg-gray);
    padding: 20px;
    border-radius: 8px;
    border-left: 5px solid var(--ocf-primary);
  }

  .highlight-code {
    color: var(--ocf-primary);
    font-weight: 800;
    font-size: 1.5rem;
    padding: 0 5px;
  }

  /* 步驟說明卡片區 (Grid) */
  .steps-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 30px;
  }

  .step-card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }

  .step-title {
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--ocf-primary);
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
  }

  .step-card ul {
    padding-left: 20px;
    margin: 0;
  }

  .step-card li {
    margin-bottom: 8px;
  }

  /* 底部警語 */
  .note-warning {
    text-align: center;
    font-size: 0.95rem;
    color: var(--warning-color);
    background: #fff5f5;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ffcccc;
  }

  /* 手機版調整 */
  @media (max-width: 768px) {
    .steps-container {
      grid-template-columns: 1fr; /* 改為單欄 */
    }
    .donate-images {
      flex-direction: column;
      align-items: center;
    }
  }
</style>
</head>
<body>

<div class="donate-section">

  <div class="donate-images">
    <img src="/assets/images/bill.png" title="發票範例" alt="電子發票示意圖" width="400">
    <img src="/assets/images/bill1989.png" title="發票愛心碼 1989" alt="愛心碼 1989 條碼" width="400">
  </div>

  <div class="donate-hero-text">
    <p style="margin:0;">
      <strong>「1989，開源久久」</strong><br>
      只要在提供電子發票的商店消費，結帳時口述愛心碼 <span class="highlight-code">1989</span>，<br>
      就可以將發票捐給 OCF，成為我們營運的大大助力！
    </p>
  </div>

  <div class="steps-container">
    
    <div class="step-card">
      <div class="step-title">🛒 實體購物</div>
      <ul>
        <li>口頭跟店員說要捐出發票，並口述 <strong>1989</strong> 愛心碼</li>
        <li>或直接出示上方條碼給店員掃描</li>
      </ul>
    </div>

    <div class="step-card">
      <div class="step-title">💻 線上購物</div>
      <ul>
        <li>在結帳頁面選擇「捐贈發票」</li>
        <li>直接輸入愛心碼 <strong>1989</strong></li>
      </ul>
    </div>

  </div>

  <div class="note-warning">
    ※ 請留意，僅 <strong>電子發票</strong> 可以捐出，紙本發票無法透過愛心碼捐贈唷！
  </div>

</div>

</body>
</html>
